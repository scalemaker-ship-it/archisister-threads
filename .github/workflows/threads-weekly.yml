name: 건축언니(@u.nakim) 스레드 자동 게시 (월/수/금)

# 월·수·금 저녁 발행. GitHub Actions 크론은 UTC 기준(KST = UTC+9).
#   목표 노출: 20:00 KST 무렵. 20:00 KST = 11:00 UTC → "0 11 * * 1,3,5"
#
# GitHub 무료 러너의 스케줄 크론은 혼잡 시 늦게 뜰 수 있어, 시작 직후
# 0~30분 랜덤 지연을 둬서 20:00~20:30 사이에 자연스럽게 분산 발행한다.
on:
  schedule:
    - cron: "0 11 * * 1,3,5"   # 20:00 KST, 월/수/금
  workflow_dispatch:            # 수동 실행 버튼
    inputs:
      dry_run:
        description: "게시하지 않고 오늘 나갈 글만 검증 (토큰 불필요)"
        type: boolean
        default: false
      check_token:
        description: "게시 안 하고 토큰이 어느 계정인지 확인(진단용)"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 크론 실행일 때만 랜덤 지연 (수동 실행은 즉시)
      - name: 랜덤 지연 (게시 시각 분산)
        if: github.event_name == 'schedule'
        run: |
          # 크론이 크게 밀려 이미 KST 자정을 넘긴 상태면(12:00 UTC 이후)
          # 추가 지연 없이 바로 게시한다.
          if [ "$(date -u +%H)" -ge 12 ]; then
            echo "크론이 지연돼 이미 KST 자정을 넘겼습니다. 랜덤 지연 없이 바로 게시합니다."
            exit 0
          fi
          DELAY=$((RANDOM % 1800))   # 0~30분
          echo "약 $((DELAY / 60))분 대기 후 게시합니다."
          sleep $DELAY

      - name: 스레드 게시
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHECK_TOKEN: ${{ inputs.check_token }}
        run: python threads_post.py

      # 발행한 날짜를 기록해 같은 날 중복 발행을 막는다.
      - name: 발행 기록 커밋
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- posted_log.json)" ]; then
            echo "발행 기록 변경 없음."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted_log.json
          git commit -m "chore: 발행 기록 갱신"
          git push
