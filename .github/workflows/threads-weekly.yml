name: 건축언니(@archi.sister) 스레드 자동 게시 (월/수/금)

# 월·수·금 + pinned_post.json 예약일 낮 15:00 KST 발행. GitHub Actions 크론은 UTC 기준(KST = UTC+9).
#
# GitHub 무료 러너의 스케줄 크론은 몇 시간씩 밀린다. 그래서 크론은 일찍(11시·13시 KST)
# 두 번 띄우고, 러너가 15:00 KST 까지 기다렸다가 0~10분 랜덤 지연 후 게시한다.
# 두 실행은 concurrency 로 직렬화되고, 늦게 도는 쪽은 posted_log.json 을 보고 그냥 종료한다.
on:
  schedule:
    - cron: "0 2 * * 1,3,5"    # 11:00 KST 기동 → 15:00 KST 까지 대기 후 게시
    - cron: "0 4 * * 1,3,5"    # 13:00 KST 백업 기동 (첫 크론이 누락/지연될 때)
  workflow_dispatch:            # 수동 실행 버튼
    inputs:
      dry_run:
        description: "게시하지 않고 오늘 나갈 글만 검증 (토큰 불필요)"
        type: boolean
        default: false
      check_token:
        description: "게시 안 하고 토큰이 어느 계정인지 확인(진단용)"
        type: boolean
        default: false
      report:
        description: "게시 안 하고 최근 글 목록을 JSON 으로 덤프(보고서용)"
        type: boolean
        default: false
      delete_ids:
        description: "삭제할 게시물 ID(쉼표 구분, 오타 글 정리용)"
        type: string
        default: ""

concurrency:
  group: archisister-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 크론 실행일 때만 15:00 KST 까지 대기 + 랜덤 지연 (수동 실행은 즉시)
      - name: 15:00 KST 까지 대기
        if: github.event_name == 'schedule'
        run: |
          NOW=$(date -u +%s)
          TARGET=$(date -u -d "$(date -u +%Y-%m-%d) 06:00:00" +%s)   # 06:00 UTC = 15:00 KST
          if [ "$NOW" -ge "$TARGET" ]; then
            echo "크론이 지연돼 이미 15:00 KST 를 넘겼습니다. 대기 없이 바로 게시합니다."
            exit 0
          fi
          DELAY=$(( TARGET - NOW + RANDOM % 600 ))   # 15:00~15:10 KST
          echo "약 $((DELAY / 60))분 대기 후 게시합니다."
          sleep $DELAY

      - name: 스레드 게시
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHECK_TOKEN: ${{ inputs.check_token }}
          REPORT: ${{ inputs.report }}
          DELETE_IDS: ${{ inputs.delete_ids }}
        run: python threads_post.py

      # 발행한 날짜를 기록해 같은 날 중복 발행을 막는다.
      - name: 발행 기록 커밋
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- posted_log.json)" ]; then
            echo "발행 기록 변경 없음."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted_log.json
          git commit -m "chore: 발행 기록 갱신"
          git push
